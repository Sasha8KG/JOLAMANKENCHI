workflows:
  jol-aman-kenchi-android-check:
    name: Jol Aman Kenchi - Android build check
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: 3.19.6
      java: 17
    scripts:
      - name: Check Worker and project configuration
        script: |
          node --check backend/cloudflare-worker/worker.js
          node scripts/preflight.mjs
      - name: Resolve Flutter packages
        script: |
          cd testapp
          flutter pub get
      - name: Analyze Dart source
        script: |
          cd testapp
          flutter analyze
      - name: Run Flutter tests
        script: |
          cd testapp
          flutter test --reporter expanded
      - name: Build debug APK
        script: |
          cd testapp
          flutter build apk --debug
    artifacts:
      - testapp/build/app/outputs/flutter-apk/app-debug.apk
      - testapp/build/**/outputs/**/*.log
