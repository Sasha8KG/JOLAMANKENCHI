name: Android app verification

on:
  push:
    branches: [main, master]
    paths:
      - 'testapp/**'
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/flutter-android.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'testapp/**'
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/flutter-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    # Skip until both the Flutter and Worker source trees are present.
    if: ${{ hashFiles('testapp/pubspec.yaml') != '' && hashFiles('backend/cloudflare-worker/worker.js') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Cloudflare Worker syntax
        run: node --check backend/cloudflare-worker/worker.js
      - name: Check project configuration
        run: node scripts/preflight.mjs
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true
      - name: Install Flutter packages
        working-directory: testapp
        run: flutter pub get
      - name: Analyze Dart source
        working-directory: testapp
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: testapp
        run: flutter test --reporter expanded
      - name: Build debug APK
        working-directory: testapp
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jol-aman-kenchi-debug-apk
          path: testapp/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
