plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release builds must use a private owner-controlled keystore. Never fall back to
// the Android debug certificate for an APK intended for distribution.
def jakStorePath = System.getenv("JAK_KEYSTORE_PATH")
def jakStorePassword = System.getenv("JAK_KEYSTORE_PASSWORD")
def jakKeyAlias = System.getenv("JAK_KEY_ALIAS")
def jakKeyPassword = System.getenv("JAK_KEY_PASSWORD")
def jakSigningConfigured = [jakStorePath, jakStorePassword, jakKeyAlias, jakKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace "com.jolamankenchi.taxi"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.jolamankenchi.taxi"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 21
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            // Values are supplied by the protected CI environment, never committed.
            storeFile file(jakStorePath ?: "missing-release-keystore.jks")
            storePassword jakStorePassword ?: "NOT_CONFIGURED"
            keyAlias jakKeyAlias ?: "NOT_CONFIGURED"
            keyPassword jakKeyPassword ?: "NOT_CONFIGURED"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

// Keep debug builds usable, but refuse a release task until all private signing
// values are present and the keystore file is mounted by the build environment.
gradle.taskGraph.whenReady { graph ->
    def requestsRelease = graph.allTasks.any { it.name.toLowerCase().contains("release") }
    if (requestsRelease && !jakSigningConfigured) {
        throw new GradleException("Release APK blocked: configure JAK_KEYSTORE_PATH, JAK_KEYSTORE_PASSWORD, JAK_KEY_ALIAS and JAK_KEY_PASSWORD as protected build secrets.")
    }
    if (requestsRelease && !file(jakStorePath).isFile()) {
        throw new GradleException("Release APK blocked: keystore file from JAK_KEYSTORE_PATH was not found.")
    }
}

flutter {
    source '../..'
}

dependencies {}
